[project]
name = "eeg-x"
version = "0.1.0"
description = "EEG-X paper training and reproducible evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.10.0",
    "numpy>=1.26,<3",
    "h5py>=3.11,<4",
    "packaging>=24",
    "mne>=1.10,<2",
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.optional-dependencies]
analysis = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2", "tensorboard>=2.18,<3"]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/test"]
python_files = ["*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
