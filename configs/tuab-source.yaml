dataset: ../.runs/data/tuab.h5
output: ../.runs/paper-v1/cross_domain/tuab/pretrain
stage: pretrain
checkpoint: null
device: cuda:1
budget: ../.runs/paper-gpu1-v1
resume: null
depth: 8
width: 64
heads: 8
dropout: 0.1
epochs: 100
warmup_epochs: 10
precision: bf16
logical_batch: 4096
microbatch: 512
workers: 2
compile: false
deterministic: true
optimizer:
  lr: 0.00024
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-09
  weight_decay: 0.01
scheduler:
  minimum_lr: 1.0e-05
gradient_clip_norm: 5.0
early_stopping:
  patience: 10
  min_delta: 0.0001
objective:
  name: raw_soft_dict_v2
  weight: 1.0
  temperature: 1.0
  k: 32
  groups: 8
  kernel_sizes:
  - 9
  - 15
  dilations:
  - 1
  - 2
  - 4
  - 8
  - 16
probe_interval: 0
diagnostic_test_probes: false
wandb:
  enabled: true
  project: eegx
  domain: cross_domain
  entity: quoc-emotiv
  group: null
  mode: online
  name: EEG-X--cross_domain--tuab--pretrain--seed-{seed}
seed: 241
pretraining_scope: tuab_source
purpose: paper
shared_gpu: true
concurrent_gpu_runs: 4
dictionary_backend: triton
normalization_backend: triton
compute:
  matmul: tf32
  convolution: ieee
  cudnn_benchmark: false
  fill_uninitialized_memory: false
