dataset: ../data/crowdsourced.h5
output: ../.runs/eegx-fixed-v1/in_domain/crowdsourced/finetune
stage: finetune
checkpoint: ../.runs/eegx-fixed-v1/in_domain/crowdsourced/pretrain/seed-{seed}/training/best.pth
device: cuda:1
budget: ../.runs/eegx-fixed-v1/usage/gpu1
depth: 8
width: 64
heads: 8
seeds:
- 241
- 242
- 243
epochs: 20
warmup_epochs: 5
precision: bf16
logical_batch: 64
microbatch: 64
workers: 2
probe_interval: 0
diagnostic_test_probes: false
wandb:
  enabled: true
  project: eegx
  domain: in_domain
  mode: online
  entity: quoc-emotiv
  group: null
  name: EEG-X--in_domain--crowdsourced--finetune--seed-{seed}
early_stopping:
  patience: 5
  min_delta: 0.0
purpose: paper
shared_gpu: true
concurrent_gpu_runs: 4
normalization_backend: triton
compute:
  matmul: tf32
  convolution: ieee
  cudnn_benchmark: false
  fill_uninitialized_memory: false
split_seed: 241
