dataset: ../.runs/data/crowdsourced.h5
output: ../.runs/paper-v1/cross_domain/crowdsourced/finetune
stage: finetune
checkpoint: ../.runs/paper-v1/cross_domain/tuab/pretrain/training/best.pth
device: cuda:1
budget: ../.runs/paper-gpu1-v1
depth: 8
width: 64
heads: 8
seeds:
- 241
- 242
- 243
- 244
- 245
epochs: 20
warmup_epochs: 5
precision: bf16
logical_batch: 64
microbatch: 16
workers: 2
probe_interval: 0
diagnostic_test_probes: false
wandb:
  enabled: true
  project: eegx
  domain: cross_domain
  mode: online
  entity: quoc-emotiv
  group: null
  name: EEG-X--cross_domain--crowdsourced--finetune--seed-{seed}
early_stopping:
  patience: 5
  min_delta: 0.0
purpose: paper
shared_gpu: true
concurrent_gpu_runs: 4
normalization_backend: triton
compute:
  matmul: tf32
  convolution: ieee
  cudnn_benchmark: false
  fill_uninitialized_memory: false
