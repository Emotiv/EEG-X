# Paths are relative to this YAML file. Set manifest to your prepared dataset.
manifest: ../data/prepared/manifest.json
output: ../.runs/eegx-d8w64
stage: pretrain
checkpoint: null
device: cuda:1
budget: ../.runs/paper-gpu1-v1
# For one-seed resume, replace seeds with seed, set the previous training/last.pth,
# and choose a fresh output. Batch checkpoint/resume paths can use {seed}.
resume: null

depth: 8
width: 64
heads: 8
seeds: [241, 242, 243, 244, 245]
dropout: 0.1
epochs: 100
warmup_epochs: 10
precision: bf16
logical_batch: 256
microbatch: 16
workers: 2
compile: false
deterministic: true

optimizer:
  lr: 0.00024
  betas: [0.9, 0.95]
  eps: 1.0e-9
  weight_decay: 0.01
scheduler:
  minimum_lr: 1.0e-5
gradient_clip_norm: 5.0
early_stopping:
  patience: 10
  min_delta: 0.0001

objective:
  name: raw_soft_dict_v2
  weight: 1.0
  temperature: 1.0
  k: 32
  groups: 8
  kernel_sizes: [9, 15]
  dilations: [1, 2, 4, 8, 16]

probe_interval: 10
diagnostic_test_probes: true

wandb:
  enabled: true
  project: eeg-x
  entity: null
  group: null
  mode: online
